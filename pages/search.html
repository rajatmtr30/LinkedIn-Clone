<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container" style="max-width: 800px; padding: 24px 16px;">
        <div class="card" style="padding: 24px;">
            <h2 style="font-size: 20px; margin-bottom: 16px;">Search Results for "Frontend Developer"</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 24px;">
                <button class="btn btn-outline" style="padding: 4px 12px; border-radius: 24px; background-color: var(--hover-bg); color: var(--text-primary); border-color: var(--text-primary);">People</button>
                <button class="btn btn-outline" style="padding: 4px 12px; border-radius: 24px;">Jobs</button>
                <button class="btn btn-outline" style="padding: 4px 12px; border-radius: 24px;">Posts</button>
            </div>
            
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; display: flex; gap: 16px; align-items: center;">
                <img src="https://i.pravatar.cc/150?img=68" alt="User" style="width: 56px; height: 56px; border-radius: 50%;">
                <div style="flex: 1;">
                    <h3 style="font-size: 16px;"><a href="profile.html">Rajat Sharma</a></h3>
                    <p style="font-size: 14px; color: var(--text-secondary);">Frontend Developer | UI/UX Enthusiast</p>
                    <p style="font-size: 12px; color: var(--text-secondary);">San Francisco, CA</p>
                </div>
                <button class="btn btn-outline" style="padding: 6px 16px; border-radius: 24px; width: auto;">Connect</button>
            </div>

            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; display: flex; gap: 16px; align-items: center;">
                <img src="https://ui-avatars.com/api/?name=TN&background=0D8ABC&color=fff" alt="Job" style="width: 56px; height: 56px; border-radius: 4px;">
                <div style="flex: 1;">
                    <h3 style="font-size: 16px;"><a href="job-details.html">Frontend Developer</a></h3>
                    <p style="font-size: 14px; color: var(--text-primary);">TechNova Solutions</p>
                    <p style="font-size: 12px; color: var(--text-secondary);">San Francisco, CA (Hybrid)</p>
                </div>
                <button class="btn btn-outline" style="padding: 6px 16px; border-radius: 24px; width: auto;">Save</button>
            </div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
