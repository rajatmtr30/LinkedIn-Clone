<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Center | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container dashboard-container" style="max-width: 800px; display: block; margin: 0 auto; padding-top: 24px;">
        <div class="card" style="padding: 40px 24px; text-align: center;">
            <h1 style="font-size: 32px; margin-bottom: 16px;">Hi Rajat, how can we help?</h1>
            <div class="search-bar" style="max-width: 500px; margin: 0 auto 32px; background-color: var(--card-bg); border: 1px solid var(--border-color);">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21.41 18.59l-5.27-5.28A6.83 6.83 0 0017 9.5 7.5 7.5 0 109.5 17a6.83 6.83 0 003.81-1.14l5.28 5.27a2 2 0 002.82-2.54zM5 9.5a4.5 4.5 0 114.5 4.5A4.5 4.5 0 015 9.5z"></path></svg>
                <input type="text" placeholder="Search for answers..." style="font-size: 16px; padding: 12px;">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left;">
                <div style="padding: 16px; border: 1px solid var(--border-color); border-radius: var(--border-radius); cursor: pointer;">
                    <h3 style="font-size: 16px; margin-bottom: 8px;">Account Settings</h3>
                    <p style="font-size: 14px; color: var(--text-secondary);">Manage your account and privacy</p>
                </div>
                <div style="padding: 16px; border: 1px solid var(--border-color); border-radius: var(--border-radius); cursor: pointer;">
                    <h3 style="font-size: 16px; margin-bottom: 8px;">Profile & Network</h3>
                    <p style="font-size: 14px; color: var(--text-secondary);">Build your profile and connections</p>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
