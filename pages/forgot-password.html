<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-layout">
        <header class="auth-header">
            <div class="container">
                <a href="../index.html" class="auth-logo">Linked<span style="background-color: var(--primary-color); color: white; padding: 0 4px; border-radius: 4px; margin-left: 2px;">in</span></a>
            </div>
        </header>

        <main class="auth-main">
            <div class="auth-card">
                <h1>Forgot password</h1>
                <p>Reset password in two quick steps</p>

                <form>
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Email or Phone" required>
                    </div>
                    
                    <button type="button" onclick="alert('Password reset link sent!')" class="btn btn-primary" style="margin-top: 16px;">Reset password</button>
                </form>

                <div class="auth-links" style="margin-top: 24px;">
                    <a href="../index.html">Back to Sign in</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
