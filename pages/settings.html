<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container dashboard-container" style="grid-template-columns: 225px 1fr;">
        <aside class="left-sidebar">
            <div class="card">
                <ul style="list-style: none;">
                    <li style="padding: 12px 16px; border-left: 2px solid var(--primary-color); background-color: var(--hover-bg); font-weight: 600; cursor: pointer;">Account preferences</li>
                    <li style="padding: 12px 16px; color: var(--text-secondary); cursor: pointer;">Sign in & security</li>
                    <li style="padding: 12px 16px; color: var(--text-secondary); cursor: pointer;">Visibility</li>
                    <li style="padding: 12px 16px; color: var(--text-secondary); cursor: pointer;">Communications</li>
                    <li style="padding: 12px 16px; color: var(--text-secondary); cursor: pointer;">Data privacy</li>
                </ul>
            </div>
        </aside>
        <section class="main-content">
            <div class="card" style="padding: 24px;">
                <h1 style="font-size: 24px; margin-bottom: 24px;">Account preferences</h1>
                
                <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px;">
                    <h3 style="font-size: 16px; margin-bottom: 8px;">Profile information</h3>
                    <p style="font-size: 14px; color: var(--text-secondary); display: flex; justify-content: space-between;">
                        Name, location, and industry
                        <button class="post-options"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 12a2 2 0 11-2-2 2 2 0 012 2zM4 10a2 2 0 102 2 2 2 0 00-2-2zm16 0a2 2 0 102 2 2 2 0 00-2-2z"></path></svg></button>
                    </p>
                </div>
                
                <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px;">
                    <h3 style="font-size: 16px; margin-bottom: 8px;">Display</h3>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p style="font-size: 14px;">Dark mode</p>
                            <p style="font-size: 12px; color: var(--text-secondary);">Choose how your LinkedIn experience looks.</p>
                        </div>
                        <button id="themeToggleBtn" class="btn btn-outline" style="padding: 4px 12px; border-radius: 24px; width: auto;">Toggle Theme</button>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('themeToggleBtn');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    document.getElementById('themeToggle').click();
                });
            }
        });
    </script>
</body>
</html>
