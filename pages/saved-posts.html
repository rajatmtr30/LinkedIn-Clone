<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Posts | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container dashboard-container" style="grid-template-columns: 225px 1fr;">
        <aside class="left-sidebar">
            <div class="card">
                <ul style="list-style: none;">
                    <li style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-color);">My items</li>
                    <li style="padding: 12px 16px; border-left: 2px solid var(--primary-color); background-color: var(--hover-bg); cursor: pointer;">Saved posts</li>
                    <li style="padding: 12px 16px; color: var(--text-secondary); cursor: pointer;"><a href="jobs.html" style="color: inherit; font-weight: normal;">Saved jobs</a></li>
                </ul>
            </div>
        </aside>
        <section class="main-content">
            <div class="card" style="padding: 24px;">
                <h2 style="font-size: 20px; margin-bottom: 24px;">Saved posts</h2>
                
                <div style="border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 16px; margin-bottom: 16px;">
                    <div style="display: flex; gap: 12px; align-items: flex-start;">
                        <img src="https://i.pravatar.cc/150?img=5" alt="User" style="width: 48px; height: 48px; border-radius: 50%;">
                        <div style="flex: 1;">
                            <h3 style="font-size: 14px;">Sarah Williams</h3>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">1d ago</p>
                            <p style="font-size: 14px;">A clean, consistent design system can save hundreds of engineering hours. Here are my top 5 tips for maintaining a scalable design system in Figma... 👇</p>
                        </div>
                        <button class="post-options"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M14 12a2 2 0 11-2-2 2 2 0 012 2zM4 10a2 2 0 102 2 2 2 0 00-2-2zm16 0a2 2 0 102 2 2 2 0 00-2-2z"></path></svg></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
