<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .error-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 52px);
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="error-layout">
        <svg viewBox="0 0 24 24" width="120" height="120" fill="var(--text-secondary)" style="margin-bottom: 24px;">
            <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 18a8 8 0 118-8 8 8 0 01-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
        </svg>
        <h1 style="font-size: 32px; margin-bottom: 16px;">This page doesn't exist</h1>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Please check your URL or return to LinkedIn home.</p>
        <a href="dashboard.html" class="btn btn-outline" style="width: auto;">Go to your feed</a>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
