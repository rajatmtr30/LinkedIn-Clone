<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .jobs-layout {
            grid-template-columns: 225px 1fr;
        }
        @media (max-width: 768px) {
            .jobs-layout {
                grid-template-columns: 1fr;
            }
        }
        .job-card {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .job-card:last-child {
            border-bottom: none;
        }
        .job-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .job-info h3 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }
        .job-info h3:hover {
            text-decoration: underline;
            cursor: pointer;
        }
        .job-info p {
            font-size: 14px;
            color: var(--text-primary);
        }
        .job-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .sidebar-menu {
            list-style: none;
        }
        .sidebar-menu li {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }
        .sidebar-menu li:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .sidebar-menu li.active {
            color: var(--primary-color);
            border-left: 2px solid var(--primary-color);
            background-color: rgba(10, 102, 194, 0.08);
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container dashboard-container jobs-layout">
        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <div class="card">
                <ul class="sidebar-menu">
                    <li class="active"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 5h-4V3.5A1.5 1.5 0 0013.5 2h-3A1.5 1.5 0 009 3.5V5H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2zM11 4h2v1h-2V4zm8 16H5V7h14v13z"></path></svg> My jobs</li>
                    <li><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M14 12a2 2 0 11-2-2 2 2 0 012 2zM4 10a2 2 0 102 2 2 2 0 00-2-2zm16 0a2 2 0 102 2 2 2 0 00-2-2z"></path></svg> Preferences</li>
                    <li><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M18 10a8 8 0 11-8-8 8 8 0 018 8zm-8-6a6 6 0 106 6 6 6 0 00-6-6zm0 10.5A4.5 4.5 0 1114.5 10 4.5 4.5 0 0110 14.5z"></path></svg> Skill Assessments</li>
                    <li><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 3v2H3V3zm-6 6h6V7h-6zm0 4h6v-2h-6zm0 4h6v-2h-6zM3 17h10v-8H3z"></path></svg> Interview prep</li>
                </ul>
            </div>
            <button class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 12a2 2 0 11-2-2 2 2 0 012 2zM4 10a2 2 0 102 2 2 2 0 00-2-2zm16 0a2 2 0 102 2 2 2 0 00-2-2z"></path></svg>
                Post a free job
            </button>
        </aside>

        <!-- Main Content -->
        <section class="main-content">
            <div class="card" style="padding: 24px;">
                <h2 style="font-size: 20px; margin-bottom: 8px;">Recommended for you</h2>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;">Based on your profile and search history</p>
                
                <div id="jobs-container">
                    <!-- Jobs injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/jobs.js"></script>
</body>
</html>
