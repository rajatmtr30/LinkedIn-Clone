<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | LinkedIn</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container dashboard-container" style="max-width: 800px; display: block; margin: 0 auto; padding-top: 24px;">
        <div class="card" style="padding: 40px;">
            <h1 style="font-size: 32px; margin-bottom: 24px;">Contact Us</h1>
            <form>
                <div class="form-group">
                    <label style="font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block;">Topic</label>
                    <select class="form-control" style="background-color: var(--card-bg);">
                        <option>General Inquiry</option>
                        <option>Support</option>
                        <option>Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block;">Message</label>
                    <textarea class="form-control" rows="5" placeholder="How can we help you?" style="resize: vertical;"></textarea>
                </div>
                <button type="button" class="btn btn-primary" onclick="alert('Message sent successfully!')">Send Message</button>
            </form>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
